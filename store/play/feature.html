<!doctype html>
<!-- The feature graphic Google Play shows at the top of the listing: 1024 by 500.
     Rendered to feature.png with headless Chrome at exactly that size (see store/listing.md). -->
<meta charset="utf-8">
<style>
  @font-face { font-family: Plex; font-weight: 700; src: url('../../app/node_modules/@expo-google-fonts/ibm-plex-mono/700Bold/IBMPlexMono_700Bold.ttf'); }
  @font-face { font-family: Plex; font-weight: 400; src: url('../../app/node_modules/@expo-google-fonts/ibm-plex-mono/400Regular/IBMPlexMono_400Regular.ttf'); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body { background: #11140F; color: #ECE6D2; font-family: Plex; display: flex; align-items: center; gap: 72px; padding: 0 84px; box-sizing: border-box; }
  .face { font-weight: 700; font-size: 104px; line-height: 1.25; white-space: pre; }
  .nose { display: block; margin-top: -0.5em; color: #FFB000; text-align: center; }
  h1 { font-size: 76px; letter-spacing: -3px; margin: 0 0 14px; line-height: 1; }
  h1 span, .prompt { color: #FFB000; }
  p { font-size: 25px; line-height: 1.45; margin: 0; color: #959B85; max-width: 16.5em; }
  p b { color: #ECE6D2; font-weight: 400; }
</style>
<body>
  <div class="face">/o o\<span class="nose">&bull;</span></div>
  <div>
    <h1>toto<span>_</span></h1>
    <p><b>Your agents keep working at home.</b> Approve what they do from your phone.</p>
  </div>
</body>
