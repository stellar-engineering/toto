# Deploys the site, the web app and the relay, which are one Cloudflare Worker, whenever any of them changes on main.
# Needs the CLOUDFLARE_API_TOKEN secret (a token that may edit Workers and their routes) and the
# CLOUDFLARE_ACCOUNT_ID variable. Never runs for pull requests, so a fork cannot reach the token.
name: Deploy site and relay
on:
  push:
    branches: [main]
    paths: ['site/**', 'relay/**', 'app/**', 'protocol.ts', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
# One at a time and in order: the last push is what ends up live.
concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Is there a token to deploy with?
        id: token
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "present=yes" >> "$GITHUB_OUTPUT" || echo "::warning::No CLOUDFLARE_API_TOKEN secret, so nothing was deployed."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The web app is the phone app built for a browser, served from /app beside the site.
      - name: Build the web app
        run: |
          cd app
          npm ci
          npx tsc --noEmit
          npx expo export -p web
          rm -rf ../site/app && cp -r dist ../site/app
      # Checked whether or not there is a token, so a change that would not deploy is caught either way.
      - name: Check
        working-directory: relay
        run: |
          npm ci
          npm run typecheck
          npx wrangler deploy --dry-run
      - name: Deploy
        if: steps.token.outputs.present
        working-directory: relay
        run: npx wrangler deploy
      - name: The site answers
        if: steps.token.outputs.present
        run: |
          curl -fsS -o /dev/null https://toto.royletron.dev/
          curl -fsS https://toto.royletron.dev/stats
