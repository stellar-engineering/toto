# Builds the app for the App Store and Google Play, and optionally hands the builds to them.
# Run by hand, from the Actions tab. Built on GitHub's machines with EAS's local build, so it
# costs no EAS build minutes; EAS still holds the signing keys, and EXPO_TOKEN lets this fetch them.
#
# Before the first run, once, on a machine where someone can sign in:
#   cd app && npx eas-cli build --platform ios --profile production --local   (creates Apple's certificate, profile and push key)
#   npx eas-cli credentials                                                   (to add the keys `eas submit` needs for each store)
# and the EXPO_TOKEN repository secret must exist.
name: Store builds
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store to build for
        type: choice
        options: [both, ios, android]
        default: both
      submit:
        description: Send the build on to TestFlight / Play internal testing
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        working-directory: app
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::No EXPO_TOKEN secret."; exit 1; }
          npm ci
          # Xcode's packaging step calls rsync and expects Apple's. With Homebrew's ahead of it on
          # the path, the export dies with a bare "Copy failed".
          export PATH="/usr/bin:$PATH"
          npx eas-cli@latest build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/toto.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: toto-ios
          path: ${{ runner.temp }}/toto.ipa
      - name: Send to TestFlight
        if: inputs.submit
        working-directory: app
        run: npx eas-cli@latest submit --platform ios --profile production --path "$RUNNER_TEMP/toto.ipa" --non-interactive

  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: app
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::No EXPO_TOKEN secret."; exit 1; }
          npm ci
          npx eas-cli@latest build --platform android --profile production --local --non-interactive --output "$RUNNER_TEMP/toto.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: toto-android
          path: ${{ runner.temp }}/toto.aab
      - name: Send to Play internal testing
        if: inputs.submit
        working-directory: app
        run: npx eas-cli@latest submit --platform android --profile production --path "$RUNNER_TEMP/toto.aab" --non-interactive
